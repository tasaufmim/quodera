name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: typecheck · lint · unit · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The build must stay hermetic: no runtime secrets, no database.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
        env:
          DATABASE_URL: ""

  database:
    name: migrations · RLS tenancy
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quodera_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d quodera_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      # Runtime role (created by migrations; unprivileged — RLS binds it)
      DATABASE_URL: postgres://quodera_app:quodera_app_dev@localhost:5432/quodera_test
      # Admin role (container superuser) — migrations & fixtures only
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/quodera_test
      APP_DB_PASSWORD: quodera_app_dev
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Apply all migrations (generated + hardening) against a clean container,
      # then prove row-level tenancy holds from both directions.
      - run: pnpm db:migrate
      - run: pnpm test:db

  e2e:
    name: e2e smoke (production build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
        env:
          DATABASE_URL: ""

  commitlint:
    name: commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint the commit range against the base branch
        run: pnpm exec commitlint --from "origin/${{ github.event.pull_request.base.ref || 'main' }}" --to HEAD

  gitleaks:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Direct, version-pinned, full-history scan. The gitleaks-action wrapper
      # derives a commit range from the push event and can produce an invalid
      # range when a push includes merged histories (a root commit on the
      # first-parent chain has no `^`), which crashed the job on our first
      # protected push. Scanning the entire history on every run is
      # deterministic, fails closed, and behaves identically for push and
      # pull_request events. Image pin: gitleaks 8.24.3 (SECURITY-DEBT-002
      # tracks digest pinning).
      - name: Scan full git history for secrets
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.24.3 \
            detect --source /repo --redact --verbose \
            --exit-code 1 --report-format sarif \
            --report-path /repo/gitleaks-results.sarif

      - name: Upload SARIF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results
          path: gitleaks-results.sarif
          if-no-files-found: ignore
